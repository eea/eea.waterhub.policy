[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eea.waterhub.policy"
version = "1.0.0a0"
description = "Plone policy package for the Copernicus Thematic Water Hub"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
authors = [
  {name = "European Environment Agency"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: Plone",
  "Framework :: Plone :: 6.0",
  "Framework :: Plone :: Addon",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "Plone>=6.1.4,<6.2",
  "eea.volto.policy==12.7",
  "plone.volto",
  "setuptools",
]

[project.optional-dependencies]
test = [
  "build",
  "plone.app.testing",
  "pytest",
  "pytest-cov",
  "pytest-plone",
  "ruff",
  "twine",
]

[project.urls]
Homepage = "https://github.com/eea/eea.waterhub.policy"
Repository = "https://github.com/eea/eea.waterhub.policy"
Issues = "https://github.com/eea/eea.waterhub.policy/issues"

[project.entry-points."z3c.autoinclude.plugin"]
target = "plone"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["eea.waterhub.policy"]

[tool.setuptools.package-data]
"eea.waterhub.policy" = ["*.zcml", "profiles/**/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["eea.waterhub.policy"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.coverage.html]
directory = "xunit-reports-current/coverage/lcov-report"

[tool.coverage.xml]
output = "xunit-reports-current/coverage/coverage.xml"

[tool.coverage.lcov]
output = "xunit-reports-current/coverage/lcov.info"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

